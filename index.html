<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Text Particles</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f6baf1; /* тёмный фон — поменяй, если хочешь розовый */
        }
        #app-container {
            width: 100%;
            height: 100%;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="canvas-container" aria-label="Animated text particles canvas"></div>
    </div>

    <div id="debug" style="position:fixed;top:5px;left:5px;color:#fff;font-size:12px;z-index:9999;background:rgba(0,0,0,0.5);padding:4px;"></div>

    <script src="utils.js"></script>
    <script src="config_manager.js"></script>
    <script src="ui_manager.js"></script>
    <script src="particle.js"></script>
    <script src="canvas_manager.js"></script>
    <script src="particle_manager.js"></script>
    <script src="text_renderer.js"></script>
    <script src="animation_controller.js"></script>
    <script src="main.js"></script>
</body>
</html>
